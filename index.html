<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT R.E.D. 공식 완구 정보 사이트</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
        }

        /* 최상단 유틸리티 바 */
        .utility-bar {
            width: 100%;
            height: 40px;
            border-bottom: 1px solid #e0e0e0;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-area {
            font-size: 13px;
            font-weight: bold;
            color: #444;
        }
        .logo-area span {
            font-size: 11px;
            color: #888;
            font-weight: normal;
            margin-left: 10px;
        }
        .right-brand {
            font-size: 14px;
            font-weight: bold;
            color: #e20011;
        }

        /* 메인 네비게이션 바 */
        .main-nav {
            display: flex;
            width: 100%;
            height: 55px;
            background-color: #f7f7f7;
            border-bottom: 3px solid #ff6600;
        }
        .nav-item {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            color: #000000;
            border-right: 1px solid #e5e5e5;
            cursor: pointer;
        }
        .nav-item:last-child {
            border-right: none;
        }
        .nav-item:hover {
            background-color: #eeeeee;
        }

        /* ★ 변경된 배너 컨테이너: Flexbox 구조로 대폭 개편 */
        .banner-container {
            display: flex;
            width: 100%;
            height: 500px; /* 기존보다 살짝 키워 로드뷰 몰입감 극대화 */
            background-color: #000000;
        }

        /* 왼쪽 사이드 컷 (비율 유지 고정) */
        .banner-left {
            flex: 2; 
            overflow: hidden;
        }

        /* 중앙 메인 VR 로드뷰 창 (가장 넓은 면적 차지) */
        .banner-main {
            flex: 5;
            position: relative;
        }

        /* 오른쪽 사이드 컷 (비율 유지 고정) */
        .banner-right {
            flex: 2.5;
            overflow: hidden;
        }

        /* 이미지 반응형 채우기 설정 */
        .banner-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* VR 컨테이너 스타일 */
        #panorama {
            width: 100%;
            height: 100%;
        }

        /* 하단 컨트롤러 및 여백 */
        .controls {
            width: 100%;
            text-align: center;
            padding: 15px 0;
            background-color: #ffffff;
        }
        .control-btn {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 1px solid #777777;
            border-radius: 50%;
            margin: 0 5px;
            text-align: center;
            line-height: 26px;
            font-size: 12px;
            color: #333333;
            cursor: pointer;
            background-color: #ffffff;
        }
        .content-section {
            max-width: 1200px;
            margin: 30px auto;
            height: 200px;
            border-top: 1px dashed #cccccc;
        }
    </style>
</head>
<body>

    <div class="utility-bar">
        <div class="logo-area">
            <strong>PROJECT R.E.D. 슈퍼 전대 시리즈</strong> 
            <span>반다이 공식 PROJECT R.E.D. 슈퍼 완구 특설 사이트</span>
        </div>
        <div class="right-brand">BANDAI TOYS</div>
    </div>

    <div class="main-nav">
        <div class="nav-item">トピックス</div>
        <div class="nav-item">商品を探す</div>
        <div class="nav-item">動画</div>
        <div class="nav-item">開発者ブログ</div>
    </div>

    <div class="banner-container">
        
        <div class="banner-cell banner-left">
            <img src="image1.jpg" alt="Side Left">
        </div>

        <div class="banner-cell banner-main">
            <div id="panorama"></div>
        </div>

        <div class="banner-cell banner-right">
            <img src="image3.jpg" alt="Side Right">
        </div>

    </div>

    <div class="controls">
        <div class="control-btn">▶</div>
        <div class="control-btn">❚❚</div>
    </div>

    <div class="content-section"></div>

    <script>
        pannellum.viewer('panorama', {
            "type": "equirectangular",
            "panorama": "vr.jpg",
            "autoLoad": true,
            "showControls": true // 로드뷰 느낌
