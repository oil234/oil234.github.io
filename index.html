<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT R.E.D. 공식 완구 정보 사이트</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        /* 기존 폰트 및 초기화 설정 유지 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
        }

        /* 상단 유틸리티 바 유지 */
        .utility-bar {
            display: table;
            width: 100%;
            height: 40px;
            border-bottom: 1px solid #e0e0e0;
            padding: 0 40px;
        }
        .utility-container {
            display: table-cell;
            vertical-align: middle;
        }
        .logo-area {
            float: left;
            font-size: 13px;
            font-weight: bold;
            color: #444;
            padding-top: 5px;
        }
        .logo-area span {
            font-size: 11px;
            color: #888;
            font-weight: normal;
            margin-left: 10px;
        }
        .right-brand {
            float: right;
            font-size: 14px;
            font-weight: bold;
            color: #e20011;
            padding-top: 5px;
        }

        /* 메인 네비게이션 바 유지 */
        .main-nav {
            display: table;
            width: 100%;
            height: 55px;
            background-color: #f7f7f7;
            border-bottom: 3px solid #ff6600;
        }
        .nav-item {
            display: table-cell;
            width: 25%;
            text-align: center;
            vertical-align: middle;
            font-weight: bold;
            font-size: 14px;
            color: #000000;
            text-decoration: none;
            border-right: 1px solid #e5e5e5;
            cursor: pointer;
        }
        .nav-item:last-child {
            border-right: none;
        }
        .nav-item:hover {
            background-color: #eeeeee;
        }

        /* 메인 배너 영역 구조 유지 */
        .banner-container {
            position: relative;
            width: 100%;
            background-color: #000000;
            overflow: hidden;
            font-size: 0;
            white-space: nowrap;
        }

        .banner-cell {
            display: inline-block;
            vertical-align: top;
            height: 450px;
        }

        /* 왼쪽 사이드 컷 유지 */
        .banner-left {
            width: 20%;
        }

        /* 중앙 메인 배너 (여기를 VR 영역으로 변경) */
        .banner-main {
            width: 55%;
            position: relative;
        }

        /* 오른쪽 사이드 컷 유지 */
        .banner-right {
            width: 25%;
        }

        /* 일반 이미지 스타일 */
        .banner-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 2. VR 창 스타일 설정 (중앙 배너 크기에 딱 맞춤) */
        #panorama {
            width: 100%;
            height: 100%;
            background-color: #000;
        }

        /* 기존 콘트롤러 및 하단 여백 유지 */
        .controls {
            width: 100%;
            text-align: center;
            padding: 15px 0;
            background-color: #ffffff;
        }
        .control-btn {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 1px solid #777777;
            border-radius: 50%;
            margin: 0 5px;
            text-align: center;
            line-height: 26px;
            font-size: 12px;
            color: #333333;
            cursor: pointer;
            background-color: #ffffff;
        }
        .content-section {
            max-width: 1200px;
            margin: 30px auto;
            height: 200px;
            border-top: 1px dashed #cccccc;
        }
    </style>
</head>
<body>

    <div class="utility-bar">
        <div class="utility-container">
            <div class="logo-area">
                <strong>PROJECT R.E.D. 슈퍼 전대 시리즈</strong> 
                <span>반다이 공식 PROJECT R.E.D. 슈퍼 완구 특설 사이트</span>
            </div>
            <div class="right-brand">
                BANDAI TOYS
            </div>
        </div>
    </div>

    <div class="main-nav">
        <div class="nav-item">トピックス (토픽)</div>
        <div class="nav-item">商品を探す (상품 찾기)</div>
        <div class="nav-item">動画 (동영상)</div>
        <div class="nav-item">開発者ブログ (개발자 블로그)</div>
    </div>

    <div class="banner-container">
        
        <div class="banner-cell banner-left">
            <img src="image1.jpg" alt="Side Cut Left">
        </div>

        <div class="banner-cell banner-main">
            <div id="panorama"></div>
        </div>

        <div class="banner-cell banner-right">
            <img src="image3.jpg" alt="Side Cut Right">
        </div>

    </div>

    <div class="controls">
        <div class="control-btn">▶</div>
        <div class="control-btn">❚❚</div>
    </div>

    <div class="content-section"></div>

    <script>
        pannellum.viewer('panorama', {
            "type": "equirectangular",
            "panorama": "vr.jpg", // 준비하신 VR 이미지 파일명
            "autoLoad": true,       // 페이지 열리자마자 자동으로 로드
            "compass": false,       // 나침반 표시 안함
            "showControls": false   // pannellum 자체 기본 버튼 숨김 (디자인 일체감을 위해)
        });
    </script>

</body>
</html>
